              "category": "general",
              "title": "How to Create an MSI Installer from the Same InstallerLab Project",
              "body": r'''# Create an MSI installer without re-authoring the project

One of the useful parts of InstallerLab is that **Setup EXE and MSI are outputs of the same project**. You do not need to maintain a separate hand-written WiX project just to produce an MSI for the same application.

## The basic workflow

1. Build and validate the InstallerLab project normally.
2. Keep files, shortcuts, registry rules and actions in the same FSS project.
3. Select the MSI build output.
4. InstallerLab translates the project into the MSI build pipeline.
5. Test the resulting MSI on a clean Windows machine.

```text
InstallerLab project / FSS
          │
          ├── Setup EXE
          └── MSI
```

> [!TIP]
> Treat the FSS project as the source of truth. When application files or integration rules change, update them once and then rebuild the output format you need.

## What stays in the project

The same project can describe:

- application files and folders;
- registry values;
- shortcuts;
- Windows shell integration;
- prerequisites;
- run actions;
- cleanup rules;
- installer languages and visual configuration.

<details>
<summary><strong>When is MSI especially useful?</strong></summary>

MSI is commonly requested in managed Windows environments because deployment tools, administrators and enterprise workflows often understand Windows Installer packages directly. A traditional Setup EXE is still useful when you want a bootstrap-style installation experience or need a different distribution flow.

</details>

## Recommended test cycle

| Test | What to verify |
|---|---|
| Fresh install | Files, shortcuts and registry state |
| Repair / reinstall | Expected Windows Installer behavior |
| Uninstall | Cleanup and application removal |
| Upgrade | Version and identity behavior |
| Non-admin/admin scenarios | Correct install scope |

> [!IMPORTANT]
> Always test the actual MSI you plan to distribute. Packaging technology does not replace application-level testing.

**InstallerLab MSI builder:** https://fernand21.github.io/installerlab-web/msi-builder/  
**Main site:** https://fernand21.github.io/installerlab-web/  
**Documentation:** https://fernand21.github.io/installerlab-web/docs/

---

*Official InstallerLab community guide.*'''
