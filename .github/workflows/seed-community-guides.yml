              "category": "general",
              "title": "How to Package a B4J App as a Portable Windows Application with InstallerLab",
              "body": r'''# B4J Portable packaging with InstallerLab

InstallerLab has a dedicated **B4J Portable** workflow. It is separate from the generic portable builder and is designed around the official B4J toolchain.

## What InstallerLab detects

The workflow checks for a B4J installation and a complete JDK, including the tools needed by the B4J packaging process. It also validates components such as:

- `B4JBuilder.exe`
- `B4JPackager11.jar`
- `java`
- `jlink`
- `jdeps`

If automatic detection is not enough, the B4J and JDK folders can be selected manually.

## Project metadata

InstallerLab reads the `.b4j` project and can use packaging properties such as:

```text
ExeName
IconFile
IncludedModules
Version
```

It can also keep project-specific portable configuration in `InstallerLab.confbuilder`.

> [!NOTE]
> InstallerLab does not replace B4J's compiler. The B4J Portable workflow uses the official B4J build/package components and then prepares the distribution layer around that result.

## Typical build flow

```text
B4J project
   │
   ├─ B4JBuilder.exe  → compile
   │
   ├─ B4JPackager11.jar → official packaged application/runtime
   │
   └─ InstallerLab → portable distribution / launcher configuration
```

## Included modules

For applications that need Java modules explicitly, the B4J project can define `#PackagerProperty: IncludedModules = ...`. InstallerLab reads this configuration as part of the B4J Portable workflow.

<details>
<summary><strong>Troubleshooting checklist</strong></summary>

- Confirm that the selected file is a valid `.b4j` project.
- Confirm that `B4JBuilder.exe` and `B4JPackager11.jar` exist in the selected B4J folder.
- Use a full JDK that contains `java`, `jlink` and `jdeps`.
- Choose an output folder outside the B4J project directory.
- Verify the icon path if `IconFile` is configured.
- Review the build output when packaging fails.

</details>

> [!TIP]
> If a portable build behaves differently from the IDE, compare the Java modules and runtime configuration first.

**B4J + InstallerLab:** https://fernand21.github.io/installerlab-web/b4j/  
**B4J installer guide:** https://fernand21.github.io/installerlab-web/b4j-installer/  
**Download InstallerLab:** https://fernand21.github.io/installerlab-web/download/

---

*Official InstallerLab community guide.*'''
            },
            {
              "category": "general",
              "title": "Multilingual Windows Installers: 20 InstallerLab UI Languages vs 36 Installer Languages",
              "body": r'''# InstallerLab interface languages and installer languages are independent

InstallerLab intentionally separates the language of the **builder application** from the languages available in the **installers you create**.

| Layer | Language support |
|---|---|
| InstallerLab application interface | 20 selectable languages |
| Generated Windows installers | Up to 36 installer languages |
| Unsupported InstallerLab UI locale | English fallback |

That means a developer can work in one InstallerLab interface language and still build an installer for a different audience.

## Example

```text
Developer uses InstallerLab in Spanish
              ↓
Project builds an installer with:
English + French + German + Japanese + ...
```

The generated installer's language selection does **not** need to match the language used in InstallerLab itself.

> [!TIP]
> Think of the 20 UI languages as a developer experience feature, and the 36 installer languages as a distribution feature for the people installing your application.

## Why the separation matters

- Teams can use the builder in their preferred supported language.
- A single project can target users in many countries.
- Unsupported application-interface locales can safely fall back to English.
- Expanding installer-language coverage does not require every new language to become an InstallerLab UI language first.

<details>
<summary><strong>Localization test checklist</strong></summary>

1. Verify installer welcome and navigation text.
2. Check long translated strings for clipping.
3. Test right-to-left languages where applicable.
4. Verify license/readme content if your project includes it.
5. Test the default language and language-selection behavior on a clean machine.

</details>

**InstallerLab features:** https://fernand21.github.io/installerlab-web/features/  
**Main site:** https://fernand21.github.io/installerlab-web/

---

*Official InstallerLab community guide.*'''
            },
            {
              "category": "general",
              "title": "InstallerLab vs Inno Setup: Visual Workflow, FSS Control and When Each Approach Fits",
              "body": r'''# InstallerLab and Inno Setup: two different packaging workflows

Developers searching for a Windows installer builder often compare a **visual packaging workflow** with a **script-first installer workflow**. InstallerLab is designed to combine a visual editor with an editable FSS project, while Inno Setup is widely known for its script-driven approach.

This is not a claim that one tool is always better. The right choice depends on the project and the developer.

## InstallerLab workflow

InstallerLab focuses on:

- visual configuration for common packaging tasks;
- editable FSS when direct control is needed;
- Setup EXE and MSI generation from the same project;
- Portable and dedicated B4J Portable workflows;
- themes and multilingual installers;
- registry, shortcuts, file associations and context-menu integration.

## Script-first workflow

A script-first installer can be attractive when a developer already has a mature installer script, wants direct text-based control from the beginning, or has an established build process around that tool.

## Where InstallerLab can reduce repetition

```text
One InstallerLab project / FSS
        │
        ├── Setup EXE
        ├── MSI
        └── Portable workflows
```

For developers who prefer to start visually and inspect the underlying rules later, this can make packaging easier to approach.

> [!TIP]
> Do not choose an installer tool only from a feature checklist. Build the same small application with the tools you are considering and compare maintenance, debugging and upgrade behavior.

<details>
<summary><strong>Questions to ask before choosing a Windows installer builder</strong></summary>

- Do I need MSI as well as a Setup EXE?
- Do I want a visual editor, a script-first workflow, or both?
- Will the installer need registry and shell integration?
- Do I need multiple installer languages?
- Do I distribute B4J applications?
- How important is it to keep one editable project as the source of truth?

</details>

## InstallerLab's design idea

**Visual when you want speed. FSS when you want control. The same project when you want EXE or MSI.**

**InstallerLab:** https://fernand21.github.io/installerlab-web/  
**Inno Setup alternative page:** https://fernand21.github.io/installerlab-web/inno-setup-alternative/  
**Documentation:** https://fernand21.github.io/installerlab-web/docs/

---

*Official InstallerLab community overview. Product comparisons should be based on the current versions and the needs of your own project.*'''
            }
          ]

          with open('/tmp/installerlab-guides.json', 'w', encoding='utf-8') as f:
              json.dump(guides, f, ensure_ascii=False)
          PY

      - name: Read repository, categories and existing discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql \
            -f query='query { repository(owner:"fernand21", name:"installerlab-web") { id discussionCategories(first:25) { nodes { id name slug } } discussions(first:100) { nodes { title } } } }' \
            > /tmp/community-meta.json
          jq -r '.data.repository.discussions.nodes[].title' /tmp/community-meta.json > /tmp/existing-titles.txt

      - name: Create missing official guides
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO_ID="$(jq -r '.data.repository.id' /tmp/community-meta.json)"

          jq -c '.[]' /tmp/installerlab-guides.json | while IFS= read -r item; do
            title="$(jq -r '.title' <<<"$item")"
            slug="$(jq -r '.category' <<<"$item")"
            body="$(jq -r '.body' <<<"$item")"

            if grep -Fxq "$title" /tmp/existing-titles.txt; then
              echo "Already exists: $title"
              continue
            fi

            CATEGORY_ID="$(jq -r --arg slug "$slug" '.data.repository.discussionCategories.nodes[] | select(.slug==$slug) | .id' /tmp/community-meta.json | head -n1)"
            if [ -z "$CATEGORY_ID" ] || [ "$CATEGORY_ID" = "null" ]; then
              echo "Missing discussion category: $slug" >&2
              exit 1
            fi

            echo "Creating: $title"
            gh api graphql \
              -f repositoryId="$REPO_ID" \
              -f categoryId="$CATEGORY_ID" \
              -f title="$title" \
              -f body="$body" \
              -f query='mutation($repositoryId:ID!, $categoryId:ID!, $title:String!, $body:String!) { createDiscussion(input:{repositoryId:$repositoryId, categoryId:$categoryId, title:$title, body:$body}) { discussion { number url } } }'
            echo "$title" >> /tmp/existing-titles.txt
          done
