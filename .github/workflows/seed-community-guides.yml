              "category": "general",
              "title": "How to Build a Windows EXE Installer with InstallerLab — Step by Step",
              "body": r'''# Build a Windows EXE installer with InstallerLab

InstallerLab is a **visual Windows installer builder** that also keeps the project editable through **FSS**. A single project can be used to build a traditional Setup EXE and, when needed, an MSI package without re-authoring the application from scratch.

> [!TIP]
> If you are evaluating Windows setup builders, start with one small application first. Add the payload, application metadata and one shortcut, then build and test before adding registry or shell integration.

## 1. Create the project

Create a new InstallerLab project and define the application name, version, publisher, executable and install location.

A typical desktop application will install under `{app}` and can use InstallerLab constants such as `{autopf}`, `{localappdata}` and `{userdocs}` when the package needs a known Windows location.

## 2. Add the application payload

Use the visual file/folder editor or edit the FSS project directly. InstallerLab keeps packaging rules in readable sections such as:

```ini
[Files]
; Add the files that belong to the application payload.
; The visual editor can generate and maintain these rules.
```

For larger applications, keep application files together so the final package is easier to inspect and maintain.

## 3. Add shortcuts and Windows integration

InstallerLab can configure shortcuts, registry entries, file associations, **Open With** integration and context-menu commands. Use only the integrations your application actually needs.

```ini
[Icons]
; Start Menu / Desktop shortcut rules live here.
```

## 4. Add prerequisites or post-install actions

Requirements can be described in `[Prerequisites]`, while commands that must run during or after installation can be placed in `[Run]`.

<details>
<summary><strong>Quick build checklist</strong></summary>

- Confirm the main executable and icon.
- Verify the install scope.
- Check shortcuts and registry entries.
- Test prerequisite detection.
- Build the Setup EXE.
- Install on a clean Windows test machine.
- Test uninstall and reinstall.

</details>

## 5. Build the Setup EXE

Run the InstallerLab build. The Setup output uses the project rules and creates the Windows installer from the same editable FSS source.

> [!NOTE]
> An unsigned installer can trigger Windows SmartScreen reputation warnings while a publisher builds reputation. A warning by itself does not mean the installer is malicious.

## Why this workflow is useful

| Workflow | Benefit |
|---|---|
| Visual editor | Faster setup for common installer tasks |
| FSS source | Direct control when a project needs advanced rules |
| Same project | Build Setup EXE and MSI without maintaining two independent definitions |
| Windows integration | Registry, shortcuts, file associations and context menus in one project |
| Themes and languages | Customize the installer experience without redesigning the application |

**InstallerLab:** https://fernand21.github.io/installerlab-web/  
**Downloads:** https://fernand21.github.io/installerlab-web/download/  
**Documentation:** https://fernand21.github.io/installerlab-web/docs/

---

*Official InstallerLab community guide. If a step is unclear, reply below with the relevant FSS section or build log (remove private keys and personal data first).*'''
            },
