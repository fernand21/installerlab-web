            {
              "category": "general",
              "title": "FSS Tutorial: Files, Registry, Shortcuts, Prerequisites and Run Actions",
              "body": r'''# FSS tutorial for InstallerLab projects

FSS is the editable project/script layer behind InstallerLab. The visual designer is convenient for common work, while FSS gives you a direct way to inspect and control installer rules.

The main sections include:

```ini
[Setup]

[Dirs]

[Files]

[Registry]

[Icons]

[Prerequisites]

[Run]

[InstallDelete]

[UninstallDelete]
```

## `[Setup]` — application and installer configuration

Use this section for project-level installer settings such as application identity and setup behavior.

## `[Dirs]` and `[Files]` — payload layout

`[Dirs]` describes directories the installation needs. `[Files]` controls what is copied into the installed application.

> [!TIP]
> Keep payload rules predictable. A clean payload layout makes upgrade and uninstall troubleshooting much easier.

## `[Registry]` — Windows configuration

Use registry rules only when the application needs them. InstallerLab can also use registry data as part of Windows integration workflows.

## `[Icons]` — shortcuts

Shortcut definitions belong here. InstallerLab distinguishes between managed shortcut rules and manual rules so advanced FSS edits can be preserved.

## `[Prerequisites]` — dependencies

Prerequisites let the installer check whether a dependency is present and decide what should happen when it is missing.

Typical detection concepts include file checks, registry checks, executable checks or command exit codes.

## `[Run]` — commands and launch actions

Use `[Run]` for commands that need to execute as part of installation or after the application has been installed.

<details>
<summary><strong>Useful InstallerLab constants</strong></summary>

| Constant | Purpose |
|---|---|
| `{app}` | Installed application directory |
| `{autopf}` | Program Files location chosen for the install architecture/scope |
| `{localappdata}` | Current user's Local AppData |
| `{userdocs}` | Current user's Documents folder |

</details>

## Delete sections

`[InstallDelete]` and `[UninstallDelete]` are useful when the installer needs explicit cleanup rules during installation or uninstall.

> [!WARNING]
> Cleanup rules deserve extra testing. Never use a broad delete rule when a narrower application-specific path will do.

## Visual + script workflow

A practical way to use InstallerLab is:

```text
Visual editor → generate/modify rules → inspect FSS → build → test
                      ↑                     │
                      └──── advanced edits ─┘
```

This gives beginners a visual entry point while still giving experienced packagers a readable project format.

**FSS and documentation:** https://fernand21.github.io/installerlab-web/docs/  
**InstallerLab:** https://fernand21.github.io/installerlab-web/

---

*Official InstallerLab community tutorial. Share a small reproducible FSS snippet in a reply if you need help with a rule.*'''
            },
