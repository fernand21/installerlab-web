name: Sync InstallerLab v2.0.0 release notes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-v2-release-notes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update v2.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0 --notes-file RELEASE_NOTES_v2.0.0.md
