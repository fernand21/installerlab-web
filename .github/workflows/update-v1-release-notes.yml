name: Update InstallerLab v1.0.0 release notes

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-v1-release-notes.yml'
      - 'RELEASE_NOTES_v1.0.0.md'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.0.0 --title "InstallerLab v1.0.0 — First Public Release" --notes-file RELEASE_NOTES_v1.0.0.md
