name: Create InstallerLab v4.0.0 draft release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/create-v4-release.yml'
      - 'RELEASE_TRIGGER_v4.0.0.txt'
      - 'RELEASE_NOTES_v4.0.0.md'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.0 >/dev/null 2>&1; then
            echo "Release v4.0.0 already exists; nothing to do."
          else
            gh release create v4.0.0 \
              --target main \
              --title "InstallerLab v4.0.0 — Web-to-EXE & Workspace Update" \
              --notes-file RELEASE_NOTES_v4.0.0.md \
              --draft
          fi
