name: Create InstallerLab v4.10 draft release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/create-v4.10-release.yml'
      - 'RELEASE_TRIGGER_v4.10.txt'
      - 'RELEASE_NOTES_v4.10.md'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.10 >/dev/null 2>&1; then
            echo "Release v4.10 already exists; nothing to do."
          else
            gh release create v4.10 \
              --target main \
              --title "InstallerLab v4.10 — RTF License Support" \
              --notes-file RELEASE_NOTES_v4.10.md \
              --draft
          fi
