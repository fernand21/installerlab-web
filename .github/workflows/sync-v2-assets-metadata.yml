name: Sync v2.0.0 refreshed asset metadata

on:
  push:
    paths:
      - '.github/workflows/sync-v2-assets-metadata.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update release notes and web fallback
        shell: python
        run: |
          from pathlib import Path

          setup_old = '8f34a3e7bf2efe1c501a85b21a4132a47361d4db468993e329f998f568570eeb'
          setup_new = '12a98e09a18ed61b330ed2dfad8d16e198e4a9ae656da9438eb9ac668840b95e'
          bundle_old = '9093b2d7c2caaad0a5f4f1e3e80f4ad684e961aad9576aabccff6c823f958472'
          bundle_new = '9d1b0bff2e8c8102c57b98290be4d0891143d43f2cdb5b41d205589c899baa41'
          bundle_size_old = '311692493'
          bundle_size_new = '311692735'

          notes = Path('RELEASE_NOTES_v2.0.0.md')
          s = notes.read_text(encoding='utf-8')
          s = s.replace(setup_old, setup_new)
          s = s.replace(bundle_old, bundle_new)
          s = s.replace(bundle_size_old, bundle_size_new)
          s = s.replace('The recommended **InstallerLab-Setup.exe** asset was refreshed after cross-machine testing exposed two Setup-bootstrapper issues.', 'The recommended **InstallerLab-Setup.exe** asset was refreshed after cross-machine testing exposed two Setup-bootstrapper issues. The **InstallerLab_Bundle.exe** asset was also rebuilt and republished from the same corrected v2 toolchain configuration.')
          s = s.replace('**Scoped fix** — this replacement updates only the recommended Setup EXE. The MSI, Bundle and Portable release assets are unchanged.', '**Scoped fix** — the Setup EXE and Bundle EXE were refreshed. The MSI and Portable release assets are unchanged.')
          notes.write_text(s, encoding='utf-8')

          js = Path('assets/release-live-v2.js')
          t = js.read_text(encoding='utf-8')
          t = t.replace(setup_old, setup_new)
          t = t.replace(bundle_old, bundle_new)
          t = t.replace(bundle_size_old, bundle_size_new)
          js.write_text(t, encoding='utf-8')

      - name: Commit metadata updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES_v2.0.0.md assets/release-live-v2.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update v2.0.0 Setup and Bundle hashes"
            git push origin HEAD:main
          fi

      - name: Sync GitHub Release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0 --notes-file RELEASE_NOTES_v2.0.0.md
