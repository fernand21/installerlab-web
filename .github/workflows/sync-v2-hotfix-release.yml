name: Sync v2.0.0 hotfix release notes

on:
  push:
    paths:
      - '.github/workflows/sync-v2-hotfix-release.yml'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync v2.0.0 release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2.0.0 --notes-file RELEASE_NOTES_v2.0.0.md
