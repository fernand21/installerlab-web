name: Sync InstallerLab community and sitemap

on:
  workflow_dispatch:
  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Seed InstallerLab community guides"]
    types: [completed]
  push:
    paths:
      - "**/*.html"
      - "community/guide-seeds/**"
      - "scripts/community_sync.py"
      - ".github/workflows/sync-community-discussions.yml"

concurrency:
  group: installerlab-community-sync
  cancel-in-progress: true

permissions:
  contents: write
  discussions: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read public GitHub Discussions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: fernand21
          REPO_NAME: installerlab-web
        run: |
          gh api graphql \
            -f owner="$REPO_OWNER" \
            -f name="$REPO_NAME" \
            -f query='query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                discussionCategories(first:25) {
                  nodes { name slug description isAnswerable }
                }
                discussions(first:100, orderBy:{field:UPDATED_AT, direction:DESC}) {
                  nodes {
                    number
                    title
                    url
                    bodyText
                    bodyHTML
                    createdAt
                    updatedAt
                    author { login avatarUrl(size:96) }
                    category { name slug isAnswerable }
                    comments(first:50) {
                      totalCount
                      nodes {
                        id
                        url
                        bodyText
                        bodyHTML
                        createdAt
                        updatedAt
                        isAnswer
                        author { login avatarUrl(size:72) }
                        replies(first:20) {
                          totalCount
                          nodes {
                            id
                            url
                            bodyText
                            bodyHTML
                            createdAt
                            updatedAt
                            author { login avatarUrl(size:64) }
                          }
                        }
                      }
                    }
                    answerChosenAt
                  }
                }
              }
            }' > /tmp/discussions-graphql.json

      - name: Render official guide sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/guide-rendered
          python3 - <<'PY'
          import glob, json, os, re, subprocess

          guides=[]
          for path in sorted(glob.glob('community/guide-seeds/*.md')):
              text=open(path,'r',encoding='utf-8').read()
              mt=re.search(r'^<!-- title: (.*) -->$', text, re.M)
              mc=re.search(r'^<!-- category: (.*) -->$', text, re.M)
              if not mt or not mc:
                  continue
              body=re.sub(r'^<!-- (?:title|category): .* -->\n?', '', text, flags=re.M).lstrip('\n').rstrip()+"\n"
              stem=os.path.splitext(os.path.basename(path))[0]
              body_path=f'/tmp/guide-rendered/{stem}.md'
              with open(body_path,'w',encoding='utf-8') as f:
                  f.write(body)
              try:
                  lastmod=subprocess.check_output(['git','log','-1','--format=%cs','--',path],text=True).strip()
              except Exception:
                  lastmod=''
              guides.append({'stem':stem,'path':path,'title':mt.group(1),'categorySlug':mc.group(1),'lastmod':lastmod})

          with open('/tmp/guide-meta.json','w',encoding='utf-8') as f:
              json.dump(guides,f,ensure_ascii=False,indent=2)
          PY

          for bodyfile in /tmp/guide-rendered/*.md; do
            [ -e "$bodyfile" ] || continue
            stem="$(basename "$bodyfile" .md)"
            gh api -X POST /markdown \
              -f text="$(cat "$bodyfile")" \
              -f mode=gfm \
              -f context="fernand21/installerlab-web" \
              > "/tmp/guide-rendered/${stem}.html"
          done

      - name: Build community mirror, permanent media and sitemap
        run: python3 scripts/community_sync.py

      - name: Publish mirror and sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A community/discussions.json community/data community/media sitemap.xml
          if git diff --cached --quiet; then
            echo "Community mirror, media and sitemap are already current."
            exit 0
          fi
          git commit -m "chore: sync community and sitemap"
          git push
