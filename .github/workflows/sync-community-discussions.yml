name: Sync InstallerLab community discussions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - ".github/workflows/sync-community-discussions.yml"

permissions:
  contents: write
  discussions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read public GitHub Discussions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: fernand21
          REPO_NAME: installerlab-web
        run: |
          gh api graphql \
            -f owner="$REPO_OWNER" \
            -f name="$REPO_NAME" \
            -f query='query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                discussionCategories(first:25) {
                  nodes { name slug description isAnswerable }
                }
                discussions(first:50, orderBy:{field:UPDATED_AT, direction:DESC}) {
                  nodes {
                    number
                    title
                    url
                    bodyText
                    bodyHTML
                    createdAt
                    updatedAt
                    author { login avatarUrl(size:96) }
                    category { name slug isAnswerable }
                    comments(first:50) {
                      totalCount
                      nodes {
                        id
                        url
                        bodyText
                        bodyHTML
                        createdAt
                        updatedAt
                        isAnswer
                        author { login avatarUrl(size:72) }
                        replies(first:20) {
                          totalCount
                          nodes {
                            id
                            url
                            bodyText
                            bodyHTML
                            createdAt
                            updatedAt
                            author { login avatarUrl(size:64) }
                          }
                        }
                      }
                    }
                    answerChosenAt
                  }
                }
              }
            }' > /tmp/discussions-graphql.json

      - name: Build static community mirror
        run: |
          mkdir -p community/data
          python3 - <<'PY'
          import json, os, glob
          from datetime import datetime, timezone

          with open('/tmp/discussions-graphql.json', 'r', encoding='utf-8') as f:
              raw = json.load(f)

          repo = raw.get('data', {}).get('repository') or {}
          categories = []
          for item in (repo.get('discussionCategories') or {}).get('nodes') or []:
              if not item:
                  continue
              categories.append({
                  'name': item.get('name') or 'General',
                  'slug': item.get('slug') or 'general',
                  'description': item.get('description') or '',
                  'isAnswerable': bool(item.get('isAnswerable')),
              })

          discussions = []
          current_numbers = set()
          for item in (repo.get('discussions') or {}).get('nodes') or []:
              if not item:
                  continue
              number = item.get('number')
              if number is None:
                  continue
              current_numbers.add(str(number))
              category = item.get('category') or {}
              author = item.get('author') or {}
              comments_block = item.get('comments') or {}

              comments = []
              for comment in comments_block.get('nodes') or []:
                  if not comment:
                      continue
                  cauthor = comment.get('author') or {}
                  replies_block = comment.get('replies') or {}
                  replies = []
                  for reply in replies_block.get('nodes') or []:
                      if not reply:
                          continue
                      rauthor = reply.get('author') or {}
                      replies.append({
                          'id': reply.get('id'),
                          'url': reply.get('url') or '',
                          'bodyText': reply.get('bodyText') or '',
                          'bodyHTML': reply.get('bodyHTML') or '',
                          'createdAt': reply.get('createdAt'),
                          'updatedAt': reply.get('updatedAt'),
                          'user': rauthor.get('login') or 'developer',
                          'avatar': rauthor.get('avatarUrl') or '',
                      })
                  comments.append({
                      'id': comment.get('id'),
                      'url': comment.get('url') or '',
                      'bodyText': comment.get('bodyText') or '',
                      'bodyHTML': comment.get('bodyHTML') or '',
                      'createdAt': comment.get('createdAt'),
                      'updatedAt': comment.get('updatedAt'),
                      'user': cauthor.get('login') or 'developer',
                      'avatar': cauthor.get('avatarUrl') or '',
                      'isAnswer': bool(comment.get('isAnswer')),
                      'replyCount': int(replies_block.get('totalCount') or 0),
                      'replies': replies,
                  })

              detail = {
                  'number': number,
                  'title': item.get('title') or '',
                  'url': item.get('url') or '',
                  'bodyText': item.get('bodyText') or '',
                  'bodyHTML': item.get('bodyHTML') or '',
                  'createdAt': item.get('createdAt'),
                  'updatedAt': item.get('updatedAt'),
                  'user': author.get('login') or 'developer',
                  'avatar': author.get('avatarUrl') or '',
                  'category': category.get('name') or 'General',
                  'categorySlug': category.get('slug') or 'general',
                  'isAnswerable': bool(category.get('isAnswerable')),
                  'commentCount': int(comments_block.get('totalCount') or 0),
                  'answered': bool(item.get('answerChosenAt')),
                  'comments': comments,
              }

              with open(f'community/data/{number}.json', 'w', encoding='utf-8') as f:
                  json.dump(detail, f, ensure_ascii=False, indent=2)
                  f.write('\n')

              discussions.append({
                  'number': number,
                  'title': detail['title'],
                  'url': detail['url'],
                  'bodyText': detail['bodyText'],
                  'createdAt': detail['createdAt'],
                  'updatedAt': detail['updatedAt'],
                  'user': detail['user'],
                  'avatar': detail['avatar'],
                  'category': detail['category'],
                  'categorySlug': detail['categorySlug'],
                  'isAnswerable': detail['isAnswerable'],
                  'comments': detail['commentCount'],
                  'answered': detail['answered'],
              })

          for path in glob.glob('community/data/*.json'):
              stem = os.path.splitext(os.path.basename(path))[0]
              if stem not in current_numbers:
                  os.remove(path)

          out = {
              'generatedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source': 'GitHub Discussions',
              'repository': 'fernand21/installerlab-web',
              'categories': categories,
              'discussions': discussions,
          }

          with open('community/discussions.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Publish mirror when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A community/discussions.json community/data
          if git diff --cached --quiet; then
            echo "Community mirror is already current."
            exit 0
          fi
          git commit -m "chore: sync community discussions"
          git push
