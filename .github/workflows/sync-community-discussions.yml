name: Sync InstallerLab community and sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Seed InstallerLab community guides"]
    types: [completed]
  push:
    paths:
      - "**/*.html"
      - "community/guide-seeds/**"
      - ".github/workflows/sync-community-discussions.yml"

concurrency:
  group: installerlab-community-sync
  cancel-in-progress: true

permissions:
  contents: write
  discussions: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read public GitHub Discussions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: fernand21
          REPO_NAME: installerlab-web
        run: |
          gh api graphql \
            -f owner="$REPO_OWNER" \
            -f name="$REPO_NAME" \
            -f query='query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                discussionCategories(first:25) {
                  nodes { name slug description isAnswerable }
                }
                discussions(first:100, orderBy:{field:UPDATED_AT, direction:DESC}) {
                  nodes {
                    number
                    title
                    url
                    bodyText
                    bodyHTML
                    createdAt
                    updatedAt
                    author { login avatarUrl(size:96) }
                    category { name slug isAnswerable }
                    comments(first:50) {
                      totalCount
                      nodes {
                        id
                        url
                        bodyText
                        bodyHTML
                        createdAt
                        updatedAt
                        isAnswer
                        author { login avatarUrl(size:72) }
                        replies(first:20) {
                          totalCount
                          nodes {
                            id
                            url
                            bodyText
                            bodyHTML
                            createdAt
                            updatedAt
                            author { login avatarUrl(size:64) }
                          }
                        }
                      }
                    }
                    answerChosenAt
                  }
                }
              }
            }' > /tmp/discussions-graphql.json

      - name: Render official guide sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/guide-rendered
          python3 - <<'PY'
          import glob, json, os, re, subprocess

          guides=[]
          for path in sorted(glob.glob('community/guide-seeds/*.md')):
              text=open(path,'r',encoding='utf-8').read()
              mt=re.search(r'^<!-- title: (.*) -->$', text, re.M)
              mc=re.search(r'^<!-- category: (.*) -->$', text, re.M)
              if not mt or not mc:
                  continue
              body=re.sub(r'^<!-- (?:title|category): .* -->\n?', '', text, flags=re.M).lstrip('\n').rstrip()+"\n"
              stem=os.path.splitext(os.path.basename(path))[0]
              body_path=f'/tmp/guide-rendered/{stem}.md'
              with open(body_path,'w',encoding='utf-8') as f:
                  f.write(body)
              try:
                  lastmod=subprocess.check_output(['git','log','-1','--format=%cs','--',path],text=True).strip()
              except Exception:
                  lastmod=''
              guides.append({'stem':stem,'path':path,'title':mt.group(1),'categorySlug':mc.group(1),'lastmod':lastmod})

          with open('/tmp/guide-meta.json','w',encoding='utf-8') as f:
              json.dump(guides,f,ensure_ascii=False,indent=2)
          PY

          for bodyfile in /tmp/guide-rendered/*.md; do
            [ -e "$bodyfile" ] || continue
            stem="$(basename "$bodyfile" .md)"
            gh api -X POST /markdown \
              -f text="$(cat "$bodyfile")" \
              -f mode=gfm \
              -f context="fernand21/installerlab-web" \
              > "/tmp/guide-rendered/${stem}.html"
          done

      - name: Build community mirror and dynamic sitemap
        run: |
          mkdir -p community/data
          python3 - <<'PY'
          import json, os, glob, re, subprocess
          from datetime import datetime, timezone
          from xml.sax.saxutils import escape

          BASE = 'https://fernand21.github.io/installerlab-web/'

          with open('/tmp/discussions-graphql.json', 'r', encoding='utf-8') as f:
              raw = json.load(f)

          def markdown_plain(md):
              s=str(md or '')
              s=re.sub(r'```[^\n]*\n([\s\S]*?)```', r'\1', s)
              s=re.sub(r'!\[([^\]]*)\]\([^)]+\)', r'\1', s)
              s=re.sub(r'\[([^\]]+)\]\([^)]+\)', r'\1', s)
              s=re.sub(r'<[^>]+>', ' ', s)
              s=re.sub(r'^[#>*+\-]+\s*', '', s, flags=re.M)
              s=re.sub(r'\*\*|__|~~|`', '', s)
              s=re.sub(r'\s+', ' ', s).strip()
              return s

          guide_by_title={}
          if os.path.exists('/tmp/guide-meta.json'):
              for g in json.load(open('/tmp/guide-meta.json','r',encoding='utf-8')):
                  md_path=f"/tmp/guide-rendered/{g['stem']}.md"
                  html_path=f"/tmp/guide-rendered/{g['stem']}.html"
                  md=open(md_path,'r',encoding='utf-8').read() if os.path.exists(md_path) else ''
                  html=open(html_path,'r',encoding='utf-8').read() if os.path.exists(html_path) else ''
                  guide_by_title[g['title']]={
                      'bodyText': markdown_plain(md),
                      'bodyHTML': html,
                      'lastmod': g.get('lastmod') or '',
                      'categorySlug': g.get('categorySlug') or 'general',
                  }

          repo = raw.get('data', {}).get('repository') or {}
          categories = []
          for item in (repo.get('discussionCategories') or {}).get('nodes') or []:
              if not item:
                  continue
              categories.append({
                  'name': item.get('name') or 'General',
                  'slug': item.get('slug') or 'general',
                  'description': item.get('description') or '',
                  'isAnswerable': bool(item.get('isAnswerable')),
              })

          discussions = []
          current_numbers = set()
          for item in (repo.get('discussions') or {}).get('nodes') or []:
              if not item:
                  continue
              number = item.get('number')
              if number is None:
                  continue
              current_numbers.add(str(number))
              category = item.get('category') or {}
              author = item.get('author') or {}
              comments_block = item.get('comments') or {}
              official = guide_by_title.get(item.get('title') or '')

              comments = []
              for comment in comments_block.get('nodes') or []:
                  if not comment:
                      continue
                  cauthor = comment.get('author') or {}
                  replies_block = comment.get('replies') or {}
                  replies = []
                  for reply in replies_block.get('nodes') or []:
                      if not reply:
                          continue
                      rauthor = reply.get('author') or {}
                      replies.append({
                          'id': reply.get('id'),
                          'url': reply.get('url') or '',
                          'bodyText': reply.get('bodyText') or '',
                          'bodyHTML': reply.get('bodyHTML') or '',
                          'createdAt': reply.get('createdAt'),
                          'updatedAt': reply.get('updatedAt'),
                          'user': rauthor.get('login') or 'developer',
                          'avatar': rauthor.get('avatarUrl') or '',
                      })
                  comments.append({
                      'id': comment.get('id'),
                      'url': comment.get('url') or '',
                      'bodyText': comment.get('bodyText') or '',
                      'bodyHTML': comment.get('bodyHTML') or '',
                      'createdAt': comment.get('createdAt'),
                      'updatedAt': comment.get('updatedAt'),
                      'user': cauthor.get('login') or 'developer',
                      'avatar': cauthor.get('avatarUrl') or '',
                      'isAnswer': bool(comment.get('isAnswer')),
                      'replyCount': int(replies_block.get('totalCount') or 0),
                      'replies': replies,
                  })

              body_text=(official or {}).get('bodyText') or item.get('bodyText') or ''
              body_html=(official or {}).get('bodyHTML') or item.get('bodyHTML') or ''
              updated_at=item.get('updatedAt')
              if official and official.get('lastmod'):
                  local_stamp=official['lastmod']+'T00:00:00Z'
                  if not updated_at or local_stamp > updated_at:
                      updated_at=local_stamp

              detail = {
                  'number': number,
                  'title': item.get('title') or '',
                  'url': item.get('url') or '',
                  'bodyText': body_text,
                  'bodyHTML': body_html,
                  'createdAt': item.get('createdAt'),
                  'updatedAt': updated_at,
                  'user': author.get('login') or 'developer',
                  'avatar': author.get('avatarUrl') or '',
                  'category': category.get('name') or 'General',
                  'categorySlug': category.get('slug') or 'general',
                  'isAnswerable': bool(category.get('isAnswerable')),
                  'commentCount': int(comments_block.get('totalCount') or 0),
                  'answered': bool(item.get('answerChosenAt')),
                  'officialGuide': bool(official),
                  'comments': comments,
              }

              with open(f'community/data/{number}.json', 'w', encoding='utf-8') as f:
                  json.dump(detail, f, ensure_ascii=False, indent=2)
                  f.write('\n')

              discussions.append({
                  'number': number,
                  'title': detail['title'],
                  'url': detail['url'],
                  'bodyText': detail['bodyText'],
                  'createdAt': detail['createdAt'],
                  'updatedAt': detail['updatedAt'],
                  'user': detail['user'],
                  'avatar': detail['avatar'],
                  'category': detail['category'],
                  'categorySlug': detail['categorySlug'],
                  'isAnswerable': detail['isAnswerable'],
                  'comments': detail['commentCount'],
                  'answered': detail['answered'],
                  'officialGuide': detail['officialGuide'],
              })

          for path in glob.glob('community/data/*.json'):
              stem = os.path.splitext(os.path.basename(path))[0]
              if stem not in current_numbers:
                  os.remove(path)

          latest_update = max((d.get('updatedAt') or '' for d in discussions), default='')
          generated_at = latest_update or '1970-01-01T00:00:00Z'

          out = {
              'generatedAt': generated_at,
              'source': 'GitHub Discussions',
              'repository': 'fernand21/installerlab-web',
              'categories': categories,
              'discussions': discussions,
          }

          with open('community/discussions.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
              f.write('\n')

          special = {
              '': ('weekly', '1.0'),
              'windows-installer-builder': ('weekly', '1.0'),
              'inno-setup-alternative': ('monthly', '0.9'),
              'msi-builder': ('monthly', '0.9'),
              'portable-app-builder': ('monthly', '0.9'),
              'b4j-installer': ('monthly', '0.9'),
              'download': ('daily', '0.9'),
              'docs': ('weekly', '0.9'),
              'community': ('daily', '0.8'),
              'features': ('monthly', '0.8'),
              'b4j': ('monthly', '0.8'),
              'changelog': ('weekly', '0.7'),
              'faq': ('monthly', '0.6'),
              'support': ('monthly', '0.6'),
              'about': ('monthly', '0.5'),
              'donate': ('monthly', '0.5'),
          }

          def git_lastmod(path):
              try:
                  return subprocess.check_output(['git','log','-1','--format=%cs','--',path], text=True).strip() or datetime.now(timezone.utc).date().isoformat()
              except Exception:
                  return datetime.now(timezone.utc).date().isoformat()

          urls = []
          for path in sorted(glob.glob('**/index.html', recursive=True)):
              with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                  html = f.read(12000)
              head = html.split('</head>', 1)[0].lower()
              if 'noindex' in head:
                  continue
              folder = os.path.dirname(path).replace('\\', '/').strip('/')
              loc = BASE if not folder else BASE + folder + '/'
              freq, priority = special.get(folder, ('monthly', '0.5'))
              urls.append({'loc':loc,'lastmod':git_lastmod(path),'changefreq':freq,'priority':priority})

          for d in discussions:
              number = d.get('number')
              if number is None:
                  continue
              updated = (d.get('updatedAt') or d.get('createdAt') or '')[:10] or datetime.now(timezone.utc).date().isoformat()
              urls.append({'loc':f'{BASE}community/topic/?id={number}','lastmod':updated,'changefreq':'daily','priority':'0.6'})

          seen=set(); unique=[]
          for item in urls:
              if item['loc'] in seen:
                  continue
              seen.add(item['loc']); unique.append(item)

          lines=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for item in unique:
              lines.extend(['  <url>',f"    <loc>{escape(item['loc'])}</loc>",f"    <lastmod>{item['lastmod']}</lastmod>",f"    <changefreq>{item['changefreq']}</changefreq>",f"    <priority>{item['priority']}</priority>",'  </url>'])
          lines.append('</urlset>')
          with open('sitemap.xml','w',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY

      - name: Publish mirror and sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A community/discussions.json community/data sitemap.xml
          if git diff --cached --quiet; then
            echo "Community mirror and sitemap are already current."
            exit 0
          fi
          git commit -m "chore: sync community and sitemap"
          git push
