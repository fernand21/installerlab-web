name: Create InstallerLab v1.0.0 draft release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/create-v1-release.yml'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; nothing to do."
          else
            gh release create v1.0.0 \
              --target main \
              --title "InstallerLab v1.0.0 — First Public Release" \
              --notes-file RELEASE_NOTES_v1.0.0.md \
              --draft
          fi
