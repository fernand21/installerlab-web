name: Trigger community sync on discussion activity

on:
  discussion:
    types: [created, edited, deleted, transferred, pinned, unpinned, labeled, unlabeled, locked, unlocked, category_changed, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: installerlab-community-live-trigger
  cancel-in-progress: true

jobs:
  dispatch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger community mirror refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-community-discussions.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
          echo "Community sync dispatched for discussion activity."
