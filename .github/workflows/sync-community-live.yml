name: Manual community sync shortcut

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger community mirror refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync-community-discussions.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"
          echo "Community sync dispatched manually."
