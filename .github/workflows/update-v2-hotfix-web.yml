name: Update v2.0.0 hotfix web metadata

on:
  push:
    paths:
      - '.github/workflows/update-v2-hotfix-web.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update live release fallback and changelog highlight
        shell: python
        run: |
          from pathlib import Path
          p = Path('assets/release-live-v2.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("size:416823296,download_count:0,digest:'sha256:86c96a8a3255a2ed8622a9a100deb5a2e09c75a1be6977c8fa01e06675f26a22'", "size:416829952,download_count:0,digest:'sha256:8f34a3e7bf2efe1c501a85b21a4132a47361d4db468993e329f998f568570eeb'")
          s = s.replace("es:['Nuevo backend Bundle con WiX Burn y un único EXE bootstrapper.'", "es:['Hotfix del Setup EXE: manejo single-instance específico y diagnóstico mejorado del runtime interno.','Nuevo backend Bundle con WiX Burn y un único EXE bootstrapper.'")
          s = s.replace("en:['New WiX Burn Bundle backend with a single bootstrapper EXE.'", "en:['Setup EXE hotfix: Setup-specific single-instance handling and improved inner-runtime diagnostics.','New WiX Burn Bundle backend with a single bootstrapper EXE.'")
          p.write_text(s, encoding='utf-8')

      - name: Commit web metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/release-live-v2.js
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update v2.0.0 Setup hotfix web metadata"
            git push origin HEAD:main
          fi
