title: "[Help] "
body:
  - type: markdown
    attributes:
      value: |
        Ask the InstallerLab community for help. Include enough technical detail to reproduce the problem when possible.

        Pide ayuda a la comunidad de InstallerLab. Incluye suficiente detalle técnico para reproducir el problema cuando sea posible.

  - type: dropdown
    id: area
    attributes:
      label: "InstallerLab area / Área de InstallerLab"
      options:
        - "Setup EXE"
        - "MSI"
        - "Portable"
        - "B4J Portable"
        - "FSS / Monaco editor"
        - "Themes / UI"
        - "Languages"
        - "Other / Otra"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: "Question or problem / Pregunta o problema"
      description: "Explain what you are trying to do, what happened and what you expected. / Explica qué intentas hacer, qué ocurrió y qué esperabas."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: "Steps, FSS or logs / Pasos, FSS o logs"
      description: "Add reproducible steps, relevant FSS lines or a short log excerpt when useful. Remove secrets and personal data first. / Añade pasos reproducibles, líneas FSS relevantes o un fragmento corto del log cuando sea útil. Elimina antes secretos y datos personales."
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: "InstallerLab version / Versión de InstallerLab"
      placeholder: "Example: 1.0.0"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: "Windows / Environment / Entorno"
      placeholder: "Windows 11 x64 · B4J/JDK details if relevant"
    validations:
      required: false
