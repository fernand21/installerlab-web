name: "💬 InstallerLab Community Post / Publicación"
description: "Ask for help, share FSS, show your project or propose an idea / Pide ayuda, comparte FSS, muestra tu proyecto o propón una idea"
title: "[Community] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for joining the InstallerLab community. This post is public and may be displayed on the official InstallerLab website.

        Gracias por participar en la comunidad de InstallerLab. Esta publicación es pública y puede mostrarse en la web oficial.

  - type: dropdown
    id: category
    attributes:
      label: "Category / Categoría"
      options:
        - "Help & Support"
        - "FSS Scripts"
        - "Showcase"
        - "Ideas"
        - "Bugs"
        - "General"
    validations:
      required: true

  - type: textarea
    id: post
    attributes:
      label: "Post / Publicación"
      description: "Explain your question, example, project or idea with enough detail for other developers to understand it. / Explica tu pregunta, ejemplo, proyecto o idea con suficiente detalle."
      placeholder: "Include FSS snippets, build details, steps to reproduce, screenshots or links when useful."
    validations:
      required: true

  - type: dropdown
    id: output
    attributes:
      label: "InstallerLab area / Área de InstallerLab"
      options:
        - "Setup EXE"
        - "MSI"
        - "Portable"
        - "B4J Portable"
        - "FSS / Monaco editor"
        - "Themes / UI"
        - "Languages"
        - "Other / Otra"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: "InstallerLab version / Versión de InstallerLab"
      placeholder: "Example: 1.0.0"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "Environment / Entorno"
      description: "Windows version, architecture, Java/B4J details or anything relevant. Do not post private keys or personal data. / Versión de Windows, arquitectura, Java/B4J u otros datos relevantes. No publiques claves privadas ni datos personales."
    validations:
      required: false

  - type: checkboxes
    id: public
    attributes:
      label: "Public community / Comunidad pública"
      options:
        - label: "I understand that this post is public and may be displayed on the InstallerLab website. / Entiendo que esta publicación es pública y puede mostrarse en la web de InstallerLab."
          required: true
